<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aerodynamic Drift: Angle of Attack</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/game-common.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nipplejs/0.10.1/nipplejs.min.js"></script>
    <style>
        .hand-btn {
            cursor: pointer;
            flex: 1;
        }
        #joystick-zone {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            z-index: 100;
            touch-action: none;
        }
        #joystick-zone.left {
            left: 0;
        }
        #joystick-zone.right {
            right: 0;
            left: auto;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            color: #fff;
            font-family: 'Orbitron', sans-serif;
            overflow: hidden;
            touch-action: none;
            display: block;
        }
        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
        }
        .header {
            display: flex;
            justify-content: space-between;
            padding: 20px;
            font-size: 24px;
            text-shadow: 0 0 10px rgba(0,255,255,0.8);
            font-family: 'Orbitron', sans-serif;
        }
        .lives {
            color: #ff3366;
            text-shadow: 0 0 10px #ff3366;
        }
        .score {
            color: #00ffff;
        }
        .hidden {
            display: none !important;
        }
        .game-title-large {
            font-size: 2.5rem;
            color: #fff;
            text-shadow: 0 0 20px #00ffff;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <button class="back-btn" onclick="window.location.href='index.html'" style="position: absolute; top: 20px; left: 20px; z-index: 1001; border: none; background: transparent; padding: 10px; cursor: pointer; font-size: 1.5rem; text-shadow: 0 0 10px rgba(0,0,0,0.8);">←</button>
    
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div class="header">
            <div style="width: 50px;"></div>
            <div class="score"><span data-i18n="score">SCORE</span>: <span id="scoreVal">0</span></div>
            <div class="lives"><span data-i18n="lives">LIVES</span>: <span id="livesVal">❤❤❤</span></div>
        </div>
    </div>
    
    <div id="menu" class="overlay">
        <div class="game-over-box" style="max-width: 600px; pointer-events: auto;">
            <!-- LANGUAGE SELECTOR -->
            <div style="text-align: center; margin-bottom: 10px; display: flex; gap: 10px; justify-content: center;">
                <button id="lang-en" class="btn outline-btn active" style="padding: 5px 15px; width: auto; text-transform:none;">English</button>
                <button id="lang-ml" class="btn outline-btn" style="padding: 5px 15px; width: auto; text-transform:none;">മലയാളം</button>
            </div>
            <h1 class="game-title-large" style="font-family: 'Outfit', sans-serif; margin-bottom: 10px;">AERODYNAMIC DRIFT</h1>
            <p data-i18n="desc1" style="margin-bottom: 10px; color: #ccc; font-family: 'Outfit', sans-serif; font-size: 1.1rem;">Use the joystick to adjust your angle of attack!</p>
            <p data-i18n="desc2" style="margin-bottom: 20px; color: #ccc; font-family: 'Outfit', sans-serif; font-size: 1.0rem;">Slice through wind or ride it. Avoid the red obstacles!</p>
            
            <div class="control-selection" style="margin-top: 10px; margin-bottom: 20px;">
                <h2 data-i18n="selectHand" style="font-size:1.2rem; font-family: 'Outfit', sans-serif; margin-bottom: 10px;">Select a side to start the game</h2>
                <div class="hand-options" style="display:flex; gap:12px;">
                    <button id="left-hand-btn" class="btn outline-btn hand-btn">
                        <span class="icon">👈</span>
                        <span data-i18n="leftHandedBtn">Left-Handed</span><br>
                        <small data-i18n="leftHandedDesc" style="font-size: 0.7em;">Joystick on Left</small>
                    </button>
                    <button id="right-hand-btn" class="btn outline-btn hand-btn">
                        <span class="icon">👉</span>
                        <span data-i18n="rightHandedBtn">Right-Handed</span><br>
                        <small data-i18n="rightHandedDesc" style="font-size: 0.7em;">Joystick on Right</small>
                    </button>
                </div>
            </div>
            
            <button class="btn btn-neutral" onclick="window.location.href='index.html'" style="margin-top: 10px;">Back to Hub</button>
        </div>
    </div>

    <div id="game-over" class="overlay hidden">
        <div class="game-over-box" style="max-width: 400px; pointer-events: auto;">
            <h1 class="game-title-large" data-i18n="gameover" style="margin-bottom: 20px; font-family: 'Outfit', sans-serif; color: #ff3366; text-shadow: 0 0 20px #ff3366;">GAME OVER</h1>
            <p style="font-size: 1.5rem; margin-bottom: 30px; font-family: 'Outfit', sans-serif;"><span data-i18n="finalscore">Final Score</span>: <span id="finalScore" style="color: #00ffff; font-weight: bold;">0</span></p>
            <button class="btn btn-primary" id="restartBtn" data-i18n="playagain" style="font-family: 'Outfit', sans-serif;">PLAY AGAIN</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        const ui = {
            menu: document.getElementById('menu'),
            gameOver: document.getElementById('game-over'),
            leftHandBtn: document.getElementById('left-hand-btn'),
            rightHandBtn: document.getElementById('right-hand-btn'),
            restartBtn: document.getElementById('restartBtn'),
            score: document.getElementById('scoreVal'),
            lives: document.getElementById('livesVal'),
            finalScore: document.getElementById('finalScore')
        };

        // Translations
        const translations = {
            en: {
                score: "SCORE",
                lives: "LIVES",
                desc1: "Use the joystick to adjust your angle of attack!",
                desc2: "Slice through wind or ride it. Avoid the red obstacles!",
                selectHand: "Select a side to start the game",
                leftHandedBtn: "Left-Handed",
                leftHandedDesc: "Joystick on Left",
                rightHandedBtn: "Right-Handed",
                rightHandedDesc: "Joystick on Right",
                gameover: "CRASHED!",
                finalscore: "Final Score",
                playagain: "PLAY AGAIN"
            },
            ml: {
                score: "സ്കോർ",
                lives: "ജീവനുകൾ",
                desc1: "നിങ്ങളുടെ ആംഗിൾ മാറ്റാൻ ജോയ്സ്റ്റിക്ക് ഉപയോഗിക്കുക!",
                desc2: "കാറ്റിനെ മുറിച്ചുകടക്കുകയോ അതോടൊപ്പം സഞ്ചരിക്കുകയോ ചെയ്യുക. ചുവന്ന തടസ്സങ്ങൾ ഒഴിവാക്കുക!",
                selectHand: "ഗെയിം തുടങ്ങാൻ ഒരു വശം തിരഞ്ഞെടുക്കുക",
                leftHandedBtn: "ഇടതുകൈ",
                leftHandedDesc: "ഇടതുവശത്ത് ജോയ്സ്റ്റിക്ക്",
                rightHandedBtn: "വലതുകൈ",
                rightHandedDesc: "വലതുവശത്ത് ജോയ്സ്റ്റിക്ക്",
                gameover: "തകർന്നു!",
                finalscore: "അന്തിമ സ്കോർ",
                playagain: "വീണ്ടും കളിക്കുക"
            }
        };

        let currentLang = 'en';
        function updateLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });
            document.getElementById('lang-en').classList.toggle('active', lang === 'en');
            document.getElementById('lang-ml').classList.toggle('active', lang === 'ml');
        }
        
        document.getElementById('lang-en').addEventListener('click', () => {
            sfxChime.currentTime=0; sfxChime.play().catch(e=>e);
            updateLanguage('en');
        });
        document.getElementById('lang-ml').addEventListener('click', () => {
            sfxChime.currentTime=0; sfxChime.play().catch(e=>e);
            updateLanguage('ml');
        });

        let width, height, scale;
        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            scale = Math.min(width, height) / 600;
        }
        window.addEventListener('resize', resize);
        resize();

        // Audio Elements
        const bgm = new Audio('sounds/drift-bgm.wav');
        bgm.loop = true;
        bgm.volume = 0.3;

        const sfxCrash = new Audio('sounds/drift-crash.wav');
        const sfxWind = new Audio('sounds/drift-wind.wav');
        const sfxChime = new Audio('sounds/drift-chime.wav');
        const sfxLose = new Audio('sounds/drift-lose.wav');

        // Assets
        const playerImg = new Image();
        playerImg.src = 'images/drift-player.png';
        const obsImg = new Image();
        obsImg.src = 'images/drift-obstacle.png';

        // Game State
        let state = 'MENU';
        let score = 0;
        let lives = 3;
        let lastTime = 0;

        let player = {
            x: 0,
            y: 0,
            tiltAngle: 0, // radians, 0 is flat
            targetTilt: 0,
            width: 80,
            height: 40,
            vy: 0, // vertical velocity
            baseGravity: 0.003 // Way lower gravity
        };

        let winds = [];
        let ambientWinds = [];
        let obstacles = [];
        let particles = [];
        let smokes = [];
        let windTimer = 0;
        let obsTimer = 0;
        let speedMultiplier = 1;
        let isMirrored = false;
        
        // Joystick Setup
        let joystickZone = document.createElement('div');
        joystickZone.id = 'joystick-zone';
        document.body.appendChild(joystickZone);
        let joystickManager = null;

        function initJoystick() {
            if (joystickManager) {
                joystickManager.destroy();
            }
            
            joystickZone.className = isMirrored ? 'left' : 'right';

            joystickManager = nipplejs.create({
                zone: joystickZone,
                mode: 'dynamic',
                color: '#00ffff',
                size: 100
            });

            joystickManager.on('move', (evt, data) => {
                if (state !== 'PLAYING') return;
                // data.vector.y is between -1 and 1
                // We map full up/down to +/- 45 degrees (PI/4)
                let tilt = data.vector.y * (Math.PI / 4);
                player.targetTilt = -tilt; // NippleJS Y is up=positive, Canvas Y is down=positive. We want joystick UP -> nose UP (negative angle in canvas)
            });

            joystickManager.on('end', () => {
                player.targetTilt = 0;
            });
        }

        function startGame(mirrored = false) {
            isMirrored = mirrored;
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(e => console.log(e));
            }
            initJoystick();
            
            state = 'PLAYING';
            score = 0;
            lives = 3;
            speedMultiplier = 1;
            ui.score.textContent = Math.floor(score);
            updateLives();
            
            player.x = width * 0.2;
            player.y = height * 0.5;
            player.tiltAngle = 0;
            player.targetTilt = 0;
            player.vy = 0;

            winds = [];
            ambientWinds = [];
            obstacles = [];
            particles = [];
            smokes = [];
            windTimer = 0;
            obsTimer = 0;
            
            // Populate ambient wind
            for(let i=0; i<15; i++) {
                spawnAmbientWind();
            }

            ui.menu.classList.add('hidden');
            ui.gameOver.classList.add('hidden');
            
            bgm.play().catch(e=>console.log(e));
            lastTime = performance.now();
            requestAnimationFrame(loop);
        }

        function updateLives() {
            let str = '';
            for(let i=0; i<lives; i++) str += '❤';
            ui.lives.textContent = str;
        }

        function gameOver() {
            state = 'GAMEOVER';
            ui.finalScore.textContent = Math.floor(score);
            ui.gameOver.classList.remove('hidden');
            sfxLose.play().catch(e=>console.log(e));
        }

        function spawnWind() {
            // Winds come from right side.
            let angle = (Math.random() - 0.5) * Math.PI / 3; // narrower angle
            let speed = (75 + Math.random() * 50) * scale; // Reduced wind speed by half
            let w = {
                x: width + 100,
                y: height * 0.1 + Math.random() * height * 0.8,
                angle: angle, // direction wind is blowing
                vx: -Math.cos(angle) * speed,
                vy: -Math.sin(angle) * speed,
                radius: 100 * scale,
                active: true
            };
            winds.push(w);
        }

        function spawnAmbientWind() {
            let speed = (100 + Math.random() * 50) * scale; // Reduced ambient wind speed by half
            ambientWinds.push({
                x: Math.random() * width * 1.5,
                y: Math.random() * height,
                length: 20 + Math.random() * 40,
                speed: speed,
                opacity: 0.1 + Math.random() * 0.15
            });
        }

        function spawnObstacle() {
            let yPos = Math.random() > 0.5 ? height * 0.2 : height * 0.8;
            if (Math.random() > 0.8) yPos = height * 0.5; // sometimes middle
            
            obstacles.push({
                x: width + 100,
                y: yPos,
                radius: 40 * scale
            });
        }

        function spawnExplosion(x, y, colorStr) {
            for(let i=0; i<30; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random()-0.5)*800 * scale,
                    vy: (Math.random()-0.5)*800 * scale,
                    life: 1.0,
                    color: colorStr,
                    size: (Math.random()*15 + 5) * scale
                });
            }
        }

        function spawnSmoke(x, y) {
            for(let i=0; i<15; i++) {
                smokes.push({
                    x: x + (Math.random()-0.5)*60 * scale,
                    y: y,
                    vx: (Math.random()-0.5)*100 * scale,
                    vy: -150 - Math.random()*200 * scale,
                    life: 1.0,
                    size: (20 + Math.random()*30) * scale
                });
            }
        }

        function checkCollision(px, py, rx, ry, r) {
            let dx = px - rx;
            let dy = py - ry;
            return dx*dx + dy*dy < r*r;
        }

        function drawBackground(dt) {
            // Simple moving grid for speed sensation
            ctx.strokeStyle = 'rgba(0, 255, 255, 0.05)';
            ctx.lineWidth = 1;
            let gridOffset = (performance.now() / 10 * speedMultiplier) % 50;
            for (let x = -gridOffset; x < width; x += 50) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, height); ctx.stroke();
            }
            for (let y = 0; y < height; y += 50) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(width, y); ctx.stroke();
            }
        }

        function loop(time) {
            if (state !== 'PLAYING') return;
            
            let dt = (time - lastTime) / 1000;
            lastTime = time;
            
            if (dt > 0.1) dt = 0.1;

            speedMultiplier += dt * 0.01;
            
            ctx.clearRect(0, 0, width, height);
            
            ctx.save();
            if (isMirrored) {
                // Mirror the entire game view
                ctx.translate(width, 0);
                ctx.scale(-1, 1);
            }
            
            drawBackground(dt);
            
            // Draw & Update ambient winds
            ctx.lineWidth = 2;
            for (let i = 0; i < ambientWinds.length; i++) {
                let aw = ambientWinds[i];
                aw.x -= aw.speed * dt * speedMultiplier;
                if (aw.x < -100) {
                    aw.x = width + Math.random() * 200;
                    aw.y = Math.random() * height;
                }
                ctx.strokeStyle = `rgba(0, 255, 255, ${aw.opacity})`;
                ctx.beginPath();
                ctx.moveTo(aw.x, aw.y);
                ctx.lineTo(aw.x + aw.length, aw.y);
                ctx.stroke();
            }

            player.tiltAngle += (player.targetTilt - player.tiltAngle) * dt * 5;
            
            player.vy += player.baseGravity * 60 * dt;
            
            let pitchLift = Math.sin(player.tiltAngle) * 200 * dt; 
            player.vy += pitchLift;

            for (let i = winds.length - 1; i >= 0; i--) {
                let w = winds[i];
                w.x += w.vx * dt * speedMultiplier;
                w.y += w.vy * dt * speedMultiplier;
                
                let dx = player.x - w.x;
                let dy = player.y - w.y;
                let distSq = dx*dx + dy*dy;
                if (distSq < w.radius * w.radius) {
                    let angleDiff = Math.abs(w.angle - player.tiltAngle);
                    
                    let forceFactor = Math.sin(angleDiff);
                    
                    let liftFromWind = Math.sin(player.tiltAngle - w.angle) * 500 * dt;
                    player.vy += liftFromWind;
                    
                    player.x += w.vx * forceFactor * dt * 0.5;
                    
                    ctx.beginPath();
                    ctx.arc(w.x, w.y, w.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 255, 255, ${0.1 * forceFactor})`;
                    ctx.fill();

                    if (w.active) {
                        sfxWind.currentTime = 0;
                        sfxWind.play().catch(e=>console.log(e));
                        w.active = false;
                    }
                }
                
                ctx.save();
                ctx.translate(w.x, w.y);
                ctx.rotate(w.angle);
                ctx.strokeStyle = `rgba(0, 255, 255, ${w.active ? 0.6 : 0.2})`;
                ctx.lineWidth = 4;
                ctx.beginPath();
                // Arrows now point LEFT
                ctx.moveTo(40, 0); ctx.lineTo(-40, 0);
                ctx.lineTo(-20, -10); ctx.moveTo(-40, 0); ctx.lineTo(-20, 10);
                ctx.stroke();
                ctx.restore();

                if (w.x < -200) winds.splice(i, 1);
            }

            if (player.x < width * 0.2) {
                player.x += (width * 0.2 - player.x) * dt * 2;
            }

            player.y += player.vy * 60 * dt;
            player.vy *= 0.95;

            if (player.y < 0 || player.y > height || player.x < 0) {
                if (player.y > height) {
                    spawnSmoke(player.x, height);
                } else {
                    spawnExplosion(player.x, player.y, '#00ffff');
                }
                lives--;
                updateLives();
                if (lives <= 0) {
                    gameOver();
                    return;
                } else {
                    player.y = height * 0.5;
                    player.vy = 0;
                    sfxCrash.play().catch(e=>console.log(e));
                }
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= 300 * dt * speedMultiplier;

                if (obsImg.complete && obsImg.naturalWidth !== 0) {
                    ctx.drawImage(obsImg, obs.x - obs.radius, obs.y - obs.radius, obs.radius*2, obs.radius*2);
                } else {
                    ctx.fillStyle = '#ff3366';
                    ctx.beginPath();
                    ctx.arc(obs.x, obs.y, obs.radius, 0, Math.PI * 2);
                    ctx.fill();
                }

                if (checkCollision(player.x, player.y, obs.x, obs.y, obs.radius + 35*scale)) {
                    spawnExplosion(player.x, player.y, '#ff3366');
                    spawnExplosion(obs.x, obs.y, '#ff00ff');
                    obstacles.splice(i, 1);
                    lives--;
                    updateLives();
                    sfxCrash.play().catch(e=>console.log(e));
                    if (lives <= 0) {
                        gameOver();
                        return;
                    }
                } else if (obs.x < -100) {
                    obstacles.splice(i, 1);
                }
            }

            windTimer += dt;
            if (windTimer > 2 / speedMultiplier) {
                windTimer = 0;
                spawnWind();
            }

            obsTimer += dt;
            if (obsTimer > 3 / speedMultiplier) {
                obsTimer = 0;
                spawnObstacle();
            }

            score += dt * 10 * speedMultiplier;
            ui.score.textContent = Math.floor(score);

            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.tiltAngle);
            
            if (playerImg.complete && playerImg.naturalWidth !== 0) {
                ctx.drawImage(playerImg, -75*scale, -37.5*scale, 150*scale, 75*scale);
                
                if (lives < 3 && lives > 0) {
                    let damagePercent = (3 - lives) / 3;
                    ctx.globalCompositeOperation = 'source-atop';
                    
                    // Red tint
                    ctx.fillStyle = `rgba(255, 0, 0, ${damagePercent * 0.4})`;
                    ctx.fillRect(-75*scale, -37.5*scale, 150*scale, 75*scale);
                    
                    // Damage scratches
                    ctx.strokeStyle = `rgba(255, 0, 0, ${damagePercent * 0.9})`;
                    ctx.lineWidth = 4*scale;
                    ctx.beginPath();
                    
                    ctx.moveTo(-10*scale, -15*scale);
                    ctx.lineTo(20*scale, 5*scale);
                    ctx.lineTo(30*scale, -5*scale);
                    
                    ctx.moveTo(0, 15*scale);
                    ctx.lineTo(-30*scale, 0);
                    
                    if (lives <= 1) { // Severe damage
                        ctx.moveTo(40*scale, 10*scale);
                        ctx.lineTo(10*scale, 20*scale);
                        ctx.lineTo(-20*scale, 25*scale);
                        
                        ctx.moveTo(-50*scale, -10*scale);
                        ctx.lineTo(-20*scale, -25*scale);
                    }
                    ctx.stroke();
                    ctx.globalCompositeOperation = 'source-over';
                }
            } else {
                ctx.fillStyle = '#00ffcc';
                ctx.beginPath();
                ctx.ellipse(0, 0, 40*scale, 15*scale, 0, 0, Math.PI * 2);
                ctx.fill();
            }
            
            ctx.fillStyle = '#ff00ff';
            ctx.globalAlpha = 0.5 + Math.random() * 0.5;
            ctx.beginPath();
            ctx.moveTo(-40*scale, -5*scale);
            ctx.lineTo(-40*scale - 20*scale - Math.random()*20*scale, 0);
            ctx.lineTo(-40*scale, 5*scale);
            ctx.fill();
            
            ctx.restore(); // Restore player transform

            // Draw Smokes
            for (let i = smokes.length - 1; i >= 0; i--) {
                let s = smokes[i];
                s.x += s.vx * dt;
                s.y += s.vy * dt;
                s.life -= dt * 0.5;
                s.size += dt * 20;
                if (s.life <= 0) {
                    smokes.splice(i, 1);
                    continue;
                }
                ctx.globalAlpha = s.life * 0.5;
                ctx.fillStyle = '#aaaaaa';
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
                ctx.fill();
            }

            // Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vy += player.baseGravity * 1000 * dt; // gravity affects particles
                p.life -= dt * 1.5;
                if (p.life <= 0) {
                    particles.splice(i, 1);
                    continue;
                }
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
                ctx.fill();
            }
            
            ctx.globalAlpha = 1.0;
            ctx.restore(); // Restore mirror transform

            requestAnimationFrame(loop);
        }

        ui.leftHandBtn.addEventListener('click', () => {
            sfxChime.currentTime=0; sfxChime.play().catch(e=>e);
            startGame(true);
        });
        ui.rightHandBtn.addEventListener('click', () => {
            sfxChime.currentTime=0; sfxChime.play().catch(e=>e);
            startGame(false);
        });
        ui.restartBtn.addEventListener('click', () => {
            sfxChime.currentTime=0; sfxChime.play().catch(e=>e);
            startGame(isMirrored);
        });
    </script>
</body>
</html>
