<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe | TinyGames</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#121212">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        .pause-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 500;
            display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        }
        .pause-overlay h2 { font-size: 2.2rem; letter-spacing: 3px; }
        .ov-btn {
            width: 75%; max-width: 280px; padding: 14px; border-radius: 12px;
            border: none; font-size: 1.05rem; font-weight: 600; cursor: pointer; color: white;
        }
        .ov-primary { background: linear-gradient(45deg, var(--primary), var(--secondary)); }
        .ov-neutral { background: #222; }
        .ov-install { background: linear-gradient(45deg, #11998e, #38ef7d); display: none; }
        #pause-bar {
            display: flex; justify-content: flex-end; align-items: center; width: 100%; max-width: 600px;
        }
        #pause-top-btn {
            background: #1e1e1e; border: 1px solid #333; border-radius: 8px; color: white;
            font-size: 1.1rem; width: 38px; height: 38px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="back-btn">&larr; Back to Hub</a>
            <h1>Tic-Tac-Toe</h1>
        </header>

        <div id="setup-area" class="room-setup">
            <h3>Matchmaking</h3>
            <div id="setup-buttons" style="margin-top: 15px;">
                <button id="create-room-btn" style="width: 100%; margin-bottom: 15px;">Create Room</button>
                <div style="display:flex; gap:10px;">
                    <input type="text" id="room-input" placeholder="Code (e.g. X7B9)" style="width:60%; text-align:center;">
                    <button id="join-btn" style="width:40%;">Join Room</button>
                </div>
            </div>
            <div id="qr-container" class="hidden" style="margin-top:20px; display:flex; flex-direction:column; align-items:center;">
                <h2 id="room-code-display" style="letter-spacing:3px; margin-bottom:10px; color:var(--primary);"></h2>
                <div id="qrcode" style="background:white; padding:10px; border-radius:8px;"></div>
                <p style="margin-top:10px; font-size:0.9rem; color:#aaa; text-align:center;">Scan to join automatically<br>or share with a friend to invite them to play</p>
            </div>
            <div id="status" class="status"></div>
        </div>

        <div id="game-area" class="hidden">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <div class="score-board" style="margin-bottom:0; flex:1;">
                    <div class="score-p1">You: <span id="player-symbol"></span></div>
                    <div class="score-p2">Turn: <span id="current-turn">X</span></div>
                </div>
                <button id="pause-top-btn">⏸</button>
            </div>

            <div class="tictactoe-board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>

            <div class="room-setup">
                <button id="reset-btn" class="hidden">Play Again</button>
            </div>
        </div>
    </div>

    <!-- Pause overlay -->
    <div class="pause-overlay" id="ttt-pause">
        <h2>PAUSED</h2>
        <button class="ov-btn ov-primary" id="ttt-resume">Resume</button>
        <button class="ov-btn ov-install" id="ttt-install">📲 Save as App</button>
        <button class="ov-btn ov-neutral" id="ttt-hub">← Back to Hub</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="js/sounds.js"></script>
    <script src="js/app.js"></script>
    <script src="js/tictactoe.js"></script>
</body>
</html>
