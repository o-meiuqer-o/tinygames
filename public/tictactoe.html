<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe | TinyGames</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="back-btn">&larr; Back to Hub</a>
            <h1>Tic-Tac-Toe</h1>
        </header>

        <div id="setup-area" class="room-setup">
            <h3>Join or Create a Room</h3>
            <div class="input-group">
                <input type="text" id="room-input" placeholder="Room Code (e.g., 1234)">
                <button id="join-btn">Join</button>
            </div>
            <div id="status" class="status">Waiting for input...</div>
        </div>

        <div id="game-area" class="hidden">
            <div class="score-board">
                <div class="score-p1">You: <span id="player-symbol"></span></div>
                <div class="score-p2">Turn: <span id="current-turn">X</span></div>
            </div>
            
            <div class="tictactoe-board" id="board">
                <div class="cell" data-index="0"></div>
                <div class="cell" data-index="1"></div>
                <div class="cell" data-index="2"></div>
                <div class="cell" data-index="3"></div>
                <div class="cell" data-index="4"></div>
                <div class="cell" data-index="5"></div>
                <div class="cell" data-index="6"></div>
                <div class="cell" data-index="7"></div>
                <div class="cell" data-index="8"></div>
            </div>
            
            <div class="room-setup">
                <button id="reset-btn" class="hidden">Play Again</button>
            </div>
        </div>
    </div>

    <script src="js/tictactoe.js"></script>
</body>
</html>
