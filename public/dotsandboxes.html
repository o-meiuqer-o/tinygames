<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dots and Boxes | TinyGames</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#121212">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <style>
        .pause-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 500;
            display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        }
        .pause-overlay h2 { font-size: 2.2rem; letter-spacing: 3px; }
        .ov-btn {
            width: 75%; max-width: 280px; padding: 14px; border-radius: 12px;
            border: none; font-size: 1.05rem; font-weight: 600; cursor: pointer; color: white;
        }
        .ov-primary { background: linear-gradient(45deg, var(--primary), var(--secondary)); }
        .ov-neutral { background: #222; }
        .ov-install { background: linear-gradient(45deg, #11998e, #38ef7d); display: none; }
        #pause-top-btn {
            background: #1e1e1e; border: 1px solid #333; border-radius: 8px; color: white;
            font-size: 1.1rem; width: 38px; height: 38px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="index.html" class="back-btn">&larr; Back to Hub</a>
            <h1>Dots &amp; Boxes</h1>
        </header>

        <div id="setup-area" class="room-setup">
            <h3>Join or Create a Room</h3>
            <div class="input-group" style="flex-direction: column; align-items: center; gap: 15px;">
                <div>
                    <label for="room-input" style="display:block; margin-bottom: 5px;">Room Code (min 4 chars):</label>
                    <input type="text" id="room-input" placeholder="e.g. 5678" style="width: 150px; text-align: center;">
                </div>
                <div>
                    <label for="grid-size" style="display:block; margin-bottom: 5px;">Grid Size (6-12):</label>
                    <input type="number" id="grid-size" min="6" max="12" value="6" style="width: 100px; text-align: center;">
                </div>
                <button id="join-btn" style="width: 150px;">Join</button>
            </div>
            <div id="status" class="status">Waiting for input...</div>
        </div>

        <div id="game-area" class="hidden">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
                <div class="score-board" style="margin-bottom:0; flex:1; font-size:1rem;">
                    <div class="score-p1" id="score-p1-disp">P1 (Cyan): 0</div>
                    <div class="status" id="turn-indicator" style="font-size:1rem;">Turn: P1</div>
                    <div class="score-p2" id="score-p2-disp">P2 (Pink): 0</div>
                </div>
                <button id="pause-top-btn">⏸</button>
            </div>

            <div id="dab-board-container" class="dab-board"></div>

            <div class="room-setup">
                <button id="reset-btn" class="hidden">Play Again</button>
            </div>
        </div>
    </div>

    <!-- Pause overlay -->
    <div class="pause-overlay" id="dab-pause">
        <h2>PAUSED</h2>
        <button class="ov-btn ov-primary" id="dab-resume">Resume</button>
        <button class="ov-btn ov-install" id="dab-install">📲 Save as App</button>
        <button class="ov-btn ov-neutral" id="dab-hub">← Back to Hub</button>
    </div>

    <script src="js/sounds.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dotsandboxes.js"></script>
</body>
</html>
