<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title data-i18n="title">Kakka Parannal | TinyGames</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#121212">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/game-common.css">
    <style>
        body { overflow: hidden; touch-action: none; background: #0a0a0a; }

        .game-wrapper {
            display: flex; flex-direction: column;
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            width: 100vw; height: 100vh;
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;
            background: #111; border-bottom: 2px solid #222; flex-shrink: 0;
        }

        .score-display {
            font-size: 1.5rem; font-weight: 800; color: #fff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        #pause-btn {
            background: #1e1e1e; border: 1px solid #333; border-radius: 8px; color: white;
            font-size: 1.2rem; width: 44px; height: 44px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .display-area {
            flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
            position: relative;
        }

        #emoji-display { font-size: 7rem; margin-bottom: 10px; line-height: 1; transition: transform 0.1s; }
        #word-display { font-size: 3rem; font-weight: 900; color: white; letter-spacing: 2px; text-transform: uppercase; text-align: center; }
        
        .timer-container {
            width: 80%; max-width: 400px; height: 12px; background: #222; border-radius: 6px;
            margin-top: 30px; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        #timer-bar {
            height: 100%; background: linear-gradient(90deg, #00d2ff, #3a7bd5); width: 100%;
            transform-origin: left;
        }

        .tap-zone {
            height: 35vh; width: 100%; background: linear-gradient(180deg, #ff007f 0%, #a1005a 100%);
            border-top: 4px solid #ff4da6; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 -10px 30px rgba(255, 0, 127, 0.2);
        }
        .tap-zone:active { background: linear-gradient(180deg, #e60073 0%, #8b004d 100%); }
        .tap-zone h2 {
            font-size: 2.5rem; color: white; font-weight: 900; text-transform: uppercase;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3); pointer-events: none;
        }

        .primary-btn { background: linear-gradient(45deg, #00d2ff, #3a7bd5); box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4); }
        .btn-danger { background: linear-gradient(45deg, #ff007f, #ff4da6); }
        .secondary-btn { background: #222; border: 1px solid #444; }

        /* Animation */
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }
        .animate-pop { animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .animate-shake { animation: shake 0.2s ease-in-out; }
    </style>
</head>
<body>

    <!-- START SCREEN / LOUNGE -->
    <div id="start-screen" class="container hub-container">
        <header>
            <h1 data-i18n="title">Kakka Parannal</h1>
            <p data-i18n="subtitle">A high-speed reflex game</p>
        </header>

        <!-- LANGUAGE SELECTOR -->
        <div style="text-align: center; margin: 15px 0;">
            <button id="lang-en" class="btn outline-btn active" style="padding: 5px 15px; width: auto; margin-right: 5px; text-transform: none;">English</button>
            <button id="lang-ml" class="btn outline-btn" style="padding: 5px 15px; width: auto; text-transform: none;">മലയാളം</button>
        </div>

        <div style="margin-top: 20px;">
            <button class="btn primary-btn" id="start-btn" data-i18n="startBtn">Play Now</button>
        </div>

        <div class="instructions">
            <p id="rules-premise" data-i18n="instructionsPremise">
                If the object CAN FLY, tap the pink zone before time runs out. If it CANNOT FLY, do nothing and wait for the timer to end!
            </p>
        </div>

        <a href="index.html" class="back-link" data-i18n="backHub">Back to Hub</a>
    </div>

    <!-- GAME WRAPPER -->
    <div class="game-wrapper hidden" id="game-container">
        <div class="top-bar">
            <a href="index.html" class="back-btn" style="text-decoration:none; color:#aaa; font-weight:600;" data-i18n="backHub">Hub</a>
            <div class="score-display"><span data-i18n="scoreText">Score: </span><span id="score">0</span></div>
            <button id="pause-btn">⏸</button>
        </div>

        <div class="display-area" id="display-area">
            <div id="emoji-display">🦅</div>
            <div id="word-display">READY?</div>
            <div class="timer-container">
                <div id="timer-bar"></div>
            </div>
        </div>

        <div class="tap-zone" id="tap-zone">
            <h2 data-i18n="ruleTapZone">Tap if it Flies!</h2>
        </div>
    </div>

    <!-- Game Over Overlay -->
    <div class="overlay hidden" id="gameover-screen">
        <div class="game-over-box">
            <h2 data-i18n="gameOverTitle">Game Over!</h2>
            <div class="score-display" style="font-size:3rem; margin:10px 0; color: white;"><span data-i18n="scoreText">Score: </span><span id="final-score">0</span></div>
            <p id="gameover-reason" style="color:#ff4da6; font-weight:bold; margin-bottom:20px;"></p>
            <button class="btn primary-btn" id="restart-btn" data-i18n="playAgain" style="margin-bottom:10px;">Play Again</button>
            <a href="index.html" class="btn secondary-btn" id="go-hub" data-i18n="backHub" style="text-decoration:none; display:block;">← Back to Hub</a>
        </div>
    </div>

    <!-- Pause Overlay -->
    <div class="overlay hidden" id="pause-screen">
        <div class="game-over-box" style="text-align: left;">
            <h2 style="text-align: center; margin-top: 0;" data-i18n="paused">PAUSED</h2>
            <div style="display: flex; gap: 10px; margin-bottom: 15px; justify-content: center;">
                <button id="lang-en-pause" class="btn outline-btn active" style="padding: 5px 10px; flex: 1; text-transform: none;">English</button>
                <button id="lang-ml-pause" class="btn outline-btn" style="padding: 5px 10px; flex: 1; text-transform: none;">മലയാളം</button>
            </div>
            <button class="btn primary-btn" style="margin-bottom:10px;" id="resume-btn" data-i18n="resume">Resume</button>
            <button class="btn btn-danger btn" id="quit-btn" data-i18n="quit">Quit Game</button>
        </div>
    </div>

    <script src="js/sounds.js"></script>
    <script src="js/kakka.js"></script>
</body>
</html>
