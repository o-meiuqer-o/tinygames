<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Kakka Parannal | TinyGames</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#121212">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { overflow: hidden; touch-action: none; background: #0a0a0a; }
        
        .game-wrapper {
            display: flex; flex-direction: column; height: 100vh; width: 100vw;
        }

        .top-bar {
            display: flex; justify-content: space-between; align-items: center; padding: 15px 20px;
            background: #111; border-bottom: 2px solid #222; flex-shrink: 0;
        }

        .score-display {
            font-size: 1.5rem; font-weight: 800; color: #fff;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.5);
        }

        #pause-btn {
            background: #1e1e1e; border: 1px solid #333; border-radius: 8px; color: white;
            font-size: 1.2rem; width: 44px; height: 44px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        .display-area {
            flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
            position: relative;
        }

        #emoji-display { font-size: 7rem; margin-bottom: 10px; line-height: 1; transition: transform 0.1s; }
        #word-display { font-size: 3rem; font-weight: 900; color: white; letter-spacing: 2px; text-transform: uppercase; text-align: center; }
        
        .timer-container {
            width: 80%; max-width: 400px; height: 12px; background: #222; border-radius: 6px;
            margin-top: 30px; overflow: hidden; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5);
        }
        #timer-bar {
            height: 100%; background: linear-gradient(90deg, #00d2ff, #3a7bd5); width: 100%;
            transform-origin: left;
        }

        .tap-zone {
            height: 35vh; width: 100%; background: linear-gradient(180deg, #ff007f 0%, #a1005a 100%);
            border-top: 4px solid #ff4da6; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 -10px 30px rgba(255, 0, 127, 0.2);
        }
        .tap-zone:active { background: linear-gradient(180deg, #e60073 0%, #8b004d 100%); }
        .tap-zone h2 {
            font-size: 2.5rem; color: white; font-weight: 900; text-transform: uppercase;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.3); pointer-events: none;
        }

        /* Overlays */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 500;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px;
        }
        .hidden { display: none !important; }
        .overlay h2 { font-size: 2.5rem; color: white; margin-bottom: 10px; text-align: center; }
        .overlay p { font-size: 1.2rem; color: #aaa; text-align: center; max-width: 80%; line-height: 1.5; }
        
        .btn {
            width: 80%; max-width: 300px; padding: 16px; border-radius: 12px;
            border: none; font-size: 1.2rem; font-weight: 800; cursor: pointer; color: white;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-primary { background: linear-gradient(45deg, #00d2ff, #3a7bd5); box-shadow: 0 4px 15px rgba(0, 210, 255, 0.4); }
        .btn-danger { background: linear-gradient(45deg, #ff007f, #ff4da6); }
        .btn-neutral { background: #222; border: 1px solid #444; }
        .btn-pwa { background: linear-gradient(45deg, #11998e, #38ef7d); display: none; }

        /* Animation */
        @keyframes pop {
            0% { transform: scale(0.8); opacity: 0; }
            70% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); }
        }
        .animate-pop { animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .animate-shake { animation: shake 0.2s ease-in-out; }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="top-bar">
            <a href="index.html" class="back-btn" style="text-decoration:none; color:#aaa; font-weight:600;">&larr; Hub</a>
            <div class="score-display">Score: <span id="score">0</span></div>
            <div style="display: flex; gap: 10px;">
                <button id="lang-btn" style="background: #1e1e1e; border: 1px solid #333; border-radius: 8px; color: white; font-weight: 800; width: 44px; height: 44px; cursor: pointer;">EN</button>
                <button id="pause-btn">⏸</button>
            </div>
        </div>

        <div class="display-area" id="display-area">
            <div id="emoji-display">🦅</div>
            <div id="word-display">READY?</div>
            <div class="timer-container">
                <div id="timer-bar"></div>
            </div>
        </div>

        <div class="tap-zone" id="tap-zone">
            <h2>Tap if it Flies!</h2>
        </div>
    </div>

    <!-- Start Overlay -->
    <div class="overlay" id="start-screen">
        <h2>Kakka Parannal</h2>
        <p>A high-speed reflex game.<br><br>If the object <b>CAN FLY</b>, tap the pink zone before time runs out.<br><br>If it <b>CANNOT FLY</b>, do nothing and wait for the timer to end!</p>
        <button class="btn btn-primary" id="start-btn">Play Now</button>
        <button class="btn btn-neutral" id="start-hub">← Back to Hub</button>
    </div>

    <!-- Game Over Overlay -->
    <div class="overlay hidden" id="gameover-screen">
        <h2>Game Over!</h2>
        <div class="score-display" style="font-size:3rem; margin:10px 0;">Score: <span id="final-score">0</span></div>
        <p id="gameover-reason" style="color:#ff4da6; font-weight:bold; margin-bottom:20px;"></p>
        <button class="btn btn-primary" id="restart-btn">Play Again</button>
        <button class="btn btn-neutral" id="go-hub">← Back to Hub</button>
    </div>

    <!-- Pause Overlay -->
    <div class="overlay hidden" id="pause-screen">
        <h2>PAUSED</h2>
        <button class="btn btn-primary" id="resume-btn">Resume</button>
        <button class="btn btn-pwa" id="install-pwa-btn">📲 Save as App</button>
        <button class="btn btn-danger" id="quit-btn">Quit Game</button>
    </div>

    <script src="js/sounds.js"></script>
    <script src="js/app.js"></script>
    <script src="js/kakka.js"></script>
</body>
</html>
