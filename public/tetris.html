<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Block Drop | TinyGames</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00d2ff; --secondary: #ff007f; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        html, body { width: 100%; height: 100%; background: #0a0a0a; color: white; overflow: hidden; touch-action: none; }

        /* ── SETUP SCREEN ─────────────────────────────────────── */
        #setup-screen {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: #0a0a0a;
            z-index: 999; gap: 18px; padding: 30px;
        }
        #setup-screen h1 {
            font-size: 3rem; font-weight: 800;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .how-to-play {
            background: #161616; border: 1px solid #2a2a2a; border-radius: 16px;
            padding: 18px 22px; width: 100%; max-width: 340px; display: flex;
            flex-direction: column; gap: 12px;
        }
        .how-to-play h3 { font-size: 0.85rem; color: #666; letter-spacing: 2px; text-transform: uppercase; }
        .tip { display: flex; align-items: center; gap: 14px; }
        .tip-icon {
            width: 44px; height: 44px; border-radius: 10px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
        }
        .tip-icon.left  { background: rgba(0,210,255,0.15); border: 1px solid rgba(0,210,255,0.3); }
        .tip-icon.right { background: rgba(255,0,127,0.15);  border: 1px solid rgba(255,0,127,0.3); }
        .tip-icon.down  { background: rgba(255,165,0,0.15);  border: 1px solid rgba(255,165,0,0.3); }
        .tip-icon.rot   { background: rgba(170,0,255,0.15);  border: 1px solid rgba(170,0,255,0.3); }
        .tip-text strong { display: block; font-size: 0.95rem; color: #eee; }
        .tip-text span   { font-size: 0.8rem; color: #666; }

        #start-game-btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none; padding: 16px 0; border-radius: 50px; color: white;
            font-size: 1.2rem; font-weight: 700; cursor: pointer; width: 100%;
            max-width: 340px; box-shadow: 0 5px 30px rgba(0,210,255,0.4);
        }
        #back-link { color: #444; text-decoration: none; font-size: 0.85rem; }

        /* ── GAME SCREEN ──────────────────────────────────────── */
        #game-screen { position: fixed; inset: 0; display: none; flex-direction: column; }

        #top-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 14px; background: rgba(0,0,0,0.85); flex-shrink: 0;
            height: 52px; z-index: 50;
        }
        #top-bar a    { color: #666; text-decoration: none; font-size: 0.85rem; }
        #score-display { font-size: 1.05rem; font-weight: 700; color: var(--primary); }
        #pause-btn {
            background: #1e1e1e; border: 1px solid #333; border-radius: 8px; color: white;
            font-size: 1.2rem; width: 40px; height: 40px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }

        /* Board area — fills space between top bar and rotate btn */
        #board-area {
            flex: 1; position: relative; display: flex;
            align-items: center; justify-content: center; overflow: hidden;
        }

        /* Board: use height:100% so it fills vertically, then aspect-ratio sets width.
           max-width:97% caps it so it never bleeds off screen on wide phones. */
        #tetris-board {
            height: 100%;
            aspect-ratio: 1 / 2;
            max-width: 97%;
            background: #111;
            border-left: 1px solid #2a2a2a;
            border-right: 1px solid #2a2a2a;
            position: relative;
        }

        .t-cell { position: absolute; box-sizing: border-box; }

        /* Touch zones — sit over board-area, not over the board element itself */
        #zone-left, #zone-right, #zone-down {
            position: absolute; z-index: 10; top: 0; bottom: 0;
        }
        #zone-left  { left: 0;   width: 20%; }
        #zone-right { right: 0;  width: 20%; }
        #zone-down  { left: 20%; width: 60%; }

        /* Rotate button — pinned to bottom */
        #rotate-area {
            flex-shrink: 0; padding: 10px 20px 22px;
            display: flex; justify-content: center; background: rgba(0,0,0,0.85);
            height: 72px;
        }
        #btn-rotate {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none; border-radius: 50px; color: white; font-size: 1.2rem;
            font-weight: 700; padding: 0; width: 90%; max-width: 360px; cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,210,255,0.3); letter-spacing: 1px;
        }

        /* ── OVERLAYS ─────────────────────────────────────────── */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 500;
            display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        }
        .overlay h2 { font-size: 2.2rem; letter-spacing: 3px; }
        .ovr-score  { color: #888; font-size: 1.1rem; }
        .ovr-score span { color: var(--primary); font-weight: 800; }
        .ov-btn {
            width: 75%; max-width: 280px; padding: 14px; border-radius: 12px;
            border: none; font-size: 1.05rem; font-weight: 600; cursor: pointer; color: white;
        }
        .ov-primary { background: linear-gradient(45deg, var(--primary), var(--secondary)); }
        .ov-neutral { background: #222; }
        .ov-danger  { background: var(--secondary); }
    </style>
</head>
<body>

<!-- SETUP -->
<div id="setup-screen">
    <h1>Block Drop</h1>
    <div class="how-to-play">
        <h3>How to Play</h3>
        <div class="tip">
            <div class="tip-icon left">◀</div>
            <div class="tip-text">
                <strong>Move Left</strong>
                <span>Tap the left 20% of the screen</span>
            </div>
        </div>
        <div class="tip">
            <div class="tip-icon right">▶</div>
            <div class="tip-text">
                <strong>Move Right</strong>
                <span>Tap the right 20% of the screen</span>
            </div>
        </div>
        <div class="tip">
            <div class="tip-icon down">▼</div>
            <div class="tip-text">
                <strong>Soft Drop</strong>
                <span>Hold the centre of the screen</span>
            </div>
        </div>
        <div class="tip">
            <div class="tip-icon rot">↻</div>
            <div class="tip-text">
                <strong>Rotate</strong>
                <span>Tap the Rotate button at the bottom</span>
            </div>
        </div>
    </div>
    <button id="start-game-btn">▶ &nbsp;Start Game</button>
    <a href="index.html" id="back-link">← Back to Hub</a>
</div>

<!-- GAME -->
<div id="game-screen">
    <div id="top-bar">
        <a href="index.html">← Hub</a>
        <div id="score-display">Score: <span id="score">0</span></div>
        <button id="pause-btn">⏸</button>
    </div>
    <div id="board-area">
        <div id="tetris-board"></div>
        <div id="zone-left"></div>
        <div id="zone-down"></div>
        <div id="zone-right"></div>
    </div>
    <div id="rotate-area">
        <button id="btn-rotate">↻ &nbsp; ROTATE</button>
    </div>
</div>

<!-- PAUSE -->
<div class="overlay" id="pause-screen">
    <h2>PAUSED</h2>
    <button class="ov-btn ov-primary" id="resume-btn">Resume</button>
    <button class="ov-btn ov-neutral" id="pause-restart-btn">Restart</button>
    <button class="ov-btn ov-danger"  id="quit-home-btn">Quit to Hub</button>
</div>

<!-- GAME OVER -->
<div class="overlay" id="gameover-screen">
    <h2>Game Over!</h2>
    <p class="ovr-score">Score: <span id="final-score">0</span></p>
    <button class="ov-btn ov-primary" id="restart-btn">Play Again</button>
    <button class="ov-btn ov-neutral" id="go-home-btn">← Hub</button>
</div>

<script src="js/tetris.js"></script>
</body>
</html>
