<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Block Drop | TinyGames</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00d2ff; --secondary: #ff007f; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        html, body { width: 100%; height: 100%; background: #0a0a0a; color: white; overflow: hidden; touch-action: none; }

        /* ── SETUP SCREEN ─────────────────────────────────────── */
        #setup-screen {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: #0a0a0a;
            z-index: 999; gap: 18px; padding: 30px;
        }
        #setup-screen h1 {
            font-size: 3rem; font-weight: 800;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* ── Phone diagram instructions ──────────────────────── */
        .phone-diagram {
            position: relative;
            width: 160px;
            height: 260px;
            border: 3px solid #444;
            border-radius: 20px;
            background: #111;
            overflow: hidden;
            flex-shrink: 0;
        }
        /* pause label top-right */
        .phone-diagram .d-pause {
            position: absolute; top: 6px; right: 8px;
            font-size: 0.6rem; color: #aaa;
            display: flex; flex-direction: column; align-items: center; gap: 2px;
        }
        .phone-diagram .d-pause-btn {
            width: 18px; height: 18px; background: #333; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-size: 0.6rem;
        }
        /* the board in the middle */
        .phone-diagram .d-board {
            position: absolute;
            left: 50%; top: 30px;
            transform: translateX(-50%);
            width: 80px; height: 160px;
            background: #1a1a1a;
            border: 1px solid #333;
        }
        /* left zone */
        .phone-diagram .d-left {
            position: absolute; left: 0; top: 30px;
            width: 30%; height: 160px;
            background: rgba(0,210,255,0.12);
            border: 1px dashed rgba(0,210,255,0.4);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        /* right zone */
        .phone-diagram .d-right {
            position: absolute; right: 0; top: 30px;
            width: 30%; height: 160px;
            background: rgba(255,0,127,0.12);
            border: 1px dashed rgba(255,0,127,0.4);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        /* centre zone (soft drop) */
        .phone-diagram .d-center {
            position: absolute;
            left: 30%; right: 30%; top: 30px;
            height: 160px;
            background: rgba(255,165,0,0.08);
        }
        /* rotate bar */
        .phone-diagram .d-rotate {
            position: absolute; bottom: 8px; left: 10%; right: 10%;
            height: 24px; background: linear-gradient(45deg,var(--primary),var(--secondary));
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem; font-weight: 700; color: white;
        }
        /* zone labels */
        .phone-diagram .lbl {
            font-size: 0.5rem; font-weight: 700; text-align: center; line-height: 1.2;
        }
        .lbl-left  { color: var(--primary); }
        .lbl-right { color: var(--secondary); }

        /* legend below diagram */
        .diagram-legend {
            display: flex; flex-direction: column; gap: 6px; margin-top: 4px;
        }
        .leg-row {
            display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: #bbb;
        }
        .leg-dot {
            width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0;
        }

        #start-game-btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none; padding: 16px 0; border-radius: 50px; color: white;
            font-size: 1.2rem; font-weight: 700; cursor: pointer; width: 100%;
            max-width: 340px; box-shadow: 0 5px 30px rgba(0,210,255,0.4);
            margin-top: 6px;
        }
        #back-link { color: #444; text-decoration: none; font-size: 0.85rem; }

        /* ── GAME SCREEN ──────────────────────────────────────── */
        #game-screen { position: fixed; inset: 0; display: none; flex-direction: column; }

        #top-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 14px; background: rgba(0,0,0,0.85); flex-shrink: 0;
            height: 52px; z-index: 50;
        }
        #top-bar a    { color: #666; text-decoration: none; font-size: 0.85rem; }
        #score-display { font-size: 1.05rem; font-weight: 700; color: var(--primary); }
        #pause-btn {
            background: #1e1e1e; border: 1px solid #333; border-radius: 8px; color: white;
            font-size: 1.2rem; width: 40px; height: 40px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }

        #board-area {
            flex: 1; position: relative; display: flex;
            align-items: center; justify-content: center; overflow: hidden;
        }
        #tetris-board {
            height: 100%; aspect-ratio: 1 / 2; max-width: 97%;
            background: #111; border-left: 1px solid #2a2a2a; border-right: 1px solid #2a2a2a;
            position: relative;
        }
        .t-cell { position: absolute; box-sizing: border-box; }

        #zone-left, #zone-right, #zone-down {
            position: absolute; z-index: 10; top: 0; bottom: 0;
        }
        #zone-left  { left: 0;   width: 20%; }
        #zone-right { right: 0;  width: 20%; }
        #zone-down  { left: 20%; width: 60%; }

        #rotate-area {
            flex-shrink: 0; padding: 10px 20px 22px;
            display: flex; justify-content: center; background: rgba(0,0,0,0.85);
            height: 72px;
        }
        #btn-rotate {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none; border-radius: 50px; color: white; font-size: 1.2rem;
            font-weight: 700; padding: 0; width: 90%; max-width: 360px; cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,210,255,0.3); letter-spacing: 1px;
        }

        /* ── OVERLAYS ─────────────────────────────────────────── */
        .overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,0.92); z-index: 500;
            display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        }
        .overlay h2 { font-size: 2.2rem; letter-spacing: 3px; }
        .ovr-score  { color: #888; font-size: 1.1rem; }
        .ovr-score span { color: var(--primary); font-weight: 800; }
        .ov-btn {
            width: 75%; max-width: 280px; padding: 14px; border-radius: 12px;
            border: none; font-size: 1.05rem; font-weight: 600; cursor: pointer; color: white;
        }
        .ov-primary { background: linear-gradient(45deg, var(--primary), var(--secondary)); }
        .ov-neutral { background: #222; }
        .ov-danger  { background: var(--secondary); }
        .ov-install { background: linear-gradient(45deg, #11998e, #38ef7d); display:none; }
    </style>
</head>
<body>

<!-- SETUP -->
<div id="setup-screen">
    <h1>Block Drop</h1>

    <!-- Phone diagram -->
    <div style="display:flex; align-items:flex-start; gap:16px;">
        <div class="phone-diagram">
            <!-- Pause label -->
            <div class="d-pause">
                <div class="d-pause-btn">⏸</div>
                <span style="font-size:0.45rem;color:#666;">pause</span>
            </div>
            <!-- Zones -->
            <div class="d-left"><span class="lbl lbl-left">◀<br>Move<br>Left</span></div>
            <div class="d-board"></div>
            <div class="d-center"></div>
            <div class="d-right"><span class="lbl lbl-right">▶<br>Move<br>Right</span></div>
            <!-- Rotate bar -->
            <div class="d-rotate">↻ ROTATE</div>
        </div>
        <!-- Legend -->
        <div class="diagram-legend">
            <div class="leg-row"><div class="leg-dot" style="background:rgba(0,210,255,0.5);border:1px dashed var(--primary);"></div>Tap left 20% → Move Left</div>
            <div class="leg-row"><div class="leg-dot" style="background:rgba(255,0,127,0.5);border:1px dashed var(--secondary);"></div>Tap right 20% → Move Right</div>
            <div class="leg-row"><div class="leg-dot" style="background:rgba(255,165,0,0.4);border:1px dashed orange;"></div>Hold centre → Soft Drop ▼</div>
            <div class="leg-row"><div class="leg-dot" style="background:var(--primary);"></div>Bottom bar → Rotate ↻</div>
            <div class="leg-row"><div class="leg-dot" style="background:#333;border:1px solid #555;"></div>Top-right → Pause ⏸</div>
        </div>
    </div>

    <button id="start-game-btn">▶ &nbsp;Start Game</button>
    <a href="index.html" id="back-link">← Back to Hub</a>
</div>

<!-- GAME -->
<div id="game-screen">
    <div id="top-bar">
        <a href="index.html">← Hub</a>
        <div id="score-display">Score: <span id="score">0</span></div>
        <button id="pause-btn">⏸</button>
    </div>
    <div id="board-area">
        <div id="tetris-board"></div>
        <div id="zone-left"></div>
        <div id="zone-down"></div>
        <div id="zone-right"></div>
    </div>
    <div id="rotate-area">
        <button id="btn-rotate">↻ &nbsp; ROTATE</button>
    </div>
</div>

<!-- PAUSE -->
<div class="overlay" id="pause-screen">
    <h2>PAUSED</h2>
    <button class="ov-btn ov-primary"  id="resume-btn">Resume</button>
    <button class="ov-btn ov-neutral"  id="pause-restart-btn">Restart</button>
    <button class="ov-btn ov-install"  id="install-pwa-pause">📲 Save as App</button>
    <button class="ov-btn ov-danger"   id="quit-home-btn">Quit to Hub</button>
</div>

<!-- GAME OVER -->
<div class="overlay" id="gameover-screen">
    <h2>Game Over!</h2>
    <p class="ovr-score">Score: <span id="final-score">0</span></p>
    <button class="ov-btn ov-primary" id="restart-btn">Play Again</button>
    <button class="ov-btn ov-neutral" id="go-home-btn">← Hub</button>
</div>

<script src="js/sounds.js"></script>
<script src="js/tetris.js"></script>
</body>
</html>
