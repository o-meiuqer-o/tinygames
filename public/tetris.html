<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Drop | TinyGames</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 400px; margin-top: 20px; margin-bottom: 20px;">
            <a href="index.html" class="back-btn" style="margin-bottom: 0;">&larr; Back to Hub</a>
            <h1 style="font-size: 2rem;">Block Drop</h1>
            <div>
                <button id="install-pwa-btn" class="install-pwa-btn hidden" style="margin: 0; padding: 5px 10px;">Install</button>
                <button id="pause-btn" style="margin-left: 10px; padding: 5px 15px; font-size: 1.2rem; background: #333;">⏸</button>
            </div>
        </header>

        <div id="setup-area" class="room-setup">
            <h3>Ready to drop some blocks?</h3>
            <button id="start-game-btn" style="width: 100%; padding: 15px; font-size: 1.2rem; margin-top: 20px;">Start Game</button>
        </div>

        <div class="tetris-wrapper hidden" id="game-area">
            <div class="score-board" style="width: 100%; max-width: 400px; display: flex; justify-content: space-between; align-items: center;">
                <div class="score-p1">Score: <span id="score">0</span></div>
            </div>
            
            <div class="tetris-layout">
                <button id="btn-rotate" class="side-btn">↻<br><span style="font-size: 0.8rem;">Rotate</span></button>
                <div class="tetris-board" id="tetris-board">
                    <div id="pause-screen" class="hidden" style="position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.8); z-index: 10; display: flex; align-items: center; justify-content: center; color: white; font-size: 2rem; font-weight: bold;">PAUSED</div>
                </div>
            </div>

            <!-- Invisible Touch Zones -->
            <div id="zone-left" class="touch-zone"></div>
            <div id="zone-right" class="touch-zone"></div>
            <div id="zone-down" class="touch-zone"></div>
        </div>

        <div id="game-over-screen" class="room-setup hidden" style="margin-top: 20px;">
            <h2 style="color: var(--secondary)">Game Over!</h2>
            <p style="margin: 10px 0;">Final Score: <span id="final-score"></span></p>
            <button id="restart-btn">Play Again</button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/tetris.js"></script>
</body>
</html>
