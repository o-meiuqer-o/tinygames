<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <link rel="manifest" href="/manifest.json">
    <title data-i18n="title">Block Drop | TinyGames</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/game-common.css">
    <style>
        :root { --primary: #00d2ff; --secondary: #ff007f; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        html, body { width: 100%; height: 100%; background: #0a0a0a; color: white; overflow: hidden; touch-action: none; }

        /* ── Phone diagram instructions ──────────────────────── */
        .phone-diagram {
            position: relative;
            width: 130px;
            height: 210px;
            border: 3px solid #444;
            border-radius: 20px;
            background: #111;
            overflow: hidden;
            flex-shrink: 0;
        }
        /* pause label top-right */
        .phone-diagram .d-pause {
            position: absolute; top: 6px; right: 8px;
            font-size: 0.6rem; color: #aaa;
            display: flex; flex-direction: column; align-items: center; gap: 2px;
        }
        .phone-diagram .d-pause-btn {
            width: 18px; height: 18px; background: #333; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-size: 0.6rem;
        }
        /* the board in the middle */
        .phone-diagram .d-board {
            position: absolute;
            left: 50%; top: 30px;
            transform: translateX(-50%);
            width: 60px; height: 120px;
            background: #1a1a1a;
            border: 1px solid #333;
        }
        /* left zone */
        .phone-diagram .d-left {
            position: absolute; left: 0; top: 30px;
            width: 30%; height: 120px;
            background: rgba(0,210,255,0.12);
            border: 1px dashed rgba(0,210,255,0.4);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        /* right zone */
        .phone-diagram .d-right {
            position: absolute; right: 0; top: 30px;
            width: 30%; height: 120px;
            background: rgba(255,0,127,0.12);
            border: 1px dashed rgba(255,0,127,0.4);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        /* centre zone (soft drop) */
        .phone-diagram .d-center {
            position: absolute;
            left: 30%; right: 30%; top: 30px;
            height: 120px;
            background: rgba(255,165,0,0.08);
        }
        /* rotate bar */
        .phone-diagram .d-rotate {
            position: absolute; bottom: 8px; left: 10%; right: 10%;
            height: 24px; background: linear-gradient(45deg,var(--primary),var(--secondary));
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            font-size: 0.65rem; font-weight: 700; color: white;
        }
        /* zone labels */
        .phone-diagram .lbl {
            font-size: 0.5rem; font-weight: 700; text-align: center; line-height: 1.2;
        }
        .lbl-left  { color: var(--primary); }
        .lbl-right { color: var(--secondary); }

        /* legend below diagram */
        .diagram-legend {
            display: flex; flex-direction: column; gap: 6px; margin-top: 4px;
            text-align: left;
        }
        .leg-row {
            display: flex; align-items: center; gap: 8px; font-size: 0.78rem; color: #bbb;
        }
        .leg-dot {
            width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0;
        }

        /* ── GAME SCREEN ──────────────────────────────────────── */
        #game-screen { display: none; flex-direction: column; width: 100vw; height: 100%; }

        #top-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 14px; background: rgba(0,0,0,0.85); flex-shrink: 0;
            height: 52px; z-index: 50;
        }
        #top-bar a    { color: #666; text-decoration: none; font-size: 0.85rem; }
        #score-display { font-size: 1.05rem; font-weight: 700; color: var(--primary); }
        #pause-btn {
            background: #1e1e1e; border: 1px solid #333; border-radius: 8px; color: white;
            font-size: 1.2rem; width: 40px; height: 40px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }

        #board-area {
            flex: 1; position: relative; display: flex;
            align-items: center; justify-content: center; overflow: hidden;
        }
        #tetris-board {
            height: 100%; aspect-ratio: 1 / 2; max-width: 97%;
            background: #111; border-left: 1px solid #2a2a2a; border-right: 1px solid #2a2a2a;
            position: relative;
        }
        .t-cell { position: absolute; box-sizing: border-box; }

        #zone-left, #zone-right, #zone-down {
            position: absolute; z-index: 10; top: 0; bottom: 0;
        }
        #zone-left  { left: 0;   width: 20%; }
        #zone-right { right: 0;  width: 20%; }
        #zone-down  { left: 20%; width: 60%; }

        #rotate-area {
            flex-shrink: 0; padding: 10px 20px 22px;
            display: flex; justify-content: center; background: rgba(0,0,0,0.85);
            height: 72px;
        }
        #btn-rotate {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none; border-radius: 50px; color: white; font-size: 1.2rem;
            font-weight: 700; padding: 0; width: 90%; max-width: 360px; cursor: pointer;
            box-shadow: 0 4px 20px rgba(0,210,255,0.3); letter-spacing: 1px;
        }

        .ovr-score  { color: #888; font-size: 1.1rem; }
        .ovr-score span { color: var(--primary); font-weight: 800; }
    </style>
</head>
<body>

<!-- LOUNGE / START SCREEN -->
<div id="start-screen" class="container hub-container">
    <header>
        <h1 data-i18n="title" style="font-size: 3rem; font-weight: 800; background: linear-gradient(45deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 5px;">Block Drop</h1>
        <p data-i18n="subtitle" style="color:#aaa; margin-bottom:15px;">Drop and clear blocks</p>
    </header>

    <!-- LANGUAGE SELECTOR -->
    <div style="text-align: center; margin: 10px 0;">
        <button id="lang-en" class="btn outline-btn active" style="padding: 5px 10px; width: auto; margin-right: 5px; text-transform:none;">English</button>
        <button id="lang-ml" class="btn outline-btn" style="padding: 5px 10px; width: auto; text-transform:none;">മലയാളം</button>
    </div>

    <!-- Phone diagram and legend -->
    <div style="display:flex; align-items:center; justify-content:center; gap:16px; margin: 20px 0;">
        <div class="phone-diagram">
            <div class="d-pause">
                <div class="d-pause-btn">⏸</div>
            </div>
            <div class="d-left"><span class="lbl lbl-left" id="lbl-left-diagram">◀<br>Move<br>Left</span></div>
            <div class="d-board"></div>
            <div class="d-center"></div>
            <div class="d-right"><span class="lbl lbl-right" id="lbl-right-diagram">▶<br>Move<br>Right</span></div>
            <div class="d-rotate" data-i18n="ruleRotate">↻ ROTATE</div>
        </div>
        
        <div class="diagram-legend">
            <h3 data-i18n="instructionsTitle" style="color: #ffd700;">Controls &amp; Zones</h3>
            <div class="leg-row"><div class="leg-dot" style="background:rgba(0,210,255,0.5);border:1px dashed var(--primary);"></div><span data-i18n="legendLeft">Tap left 20% → Move Left</span></div>
            <div class="leg-row"><div class="leg-dot" style="background:rgba(255,0,127,0.5);border:1px dashed var(--secondary);"></div><span data-i18n="legendRight">Tap right 20% → Move Right</span></div>
            <div class="leg-row"><div class="leg-dot" style="background:rgba(255,165,0,0.4);border:1px dashed orange;"></div><span data-i18n="legendCenter">Hold centre → Soft Drop ▼</span></div>
            <div class="leg-row"><div class="leg-dot" style="background:var(--primary);"></div><span data-i18n="legendRotate">Bottom bar → Rotate ↻</span></div>
            <div class="leg-row"><div class="leg-dot" style="background:#333;border:1px solid #555;"></div><span data-i18n="legendPause">Top-right → Pause ⏸</span></div>
        </div>
    </div>

    <button id="start-game-btn" class="btn btn-primary" data-i18n="startBtn" style="border-radius: 50px; margin-top:10px;">▶ &nbsp;Start Game</button>
    <a href="index.html" class="back-link" data-i18n="backHub">Back to Hub</a>
</div>

<!-- GAME -->
<div id="game-screen">
    <div id="top-bar">
        <a href="index.html" data-i18n="backHub">← Hub</a>
        <div id="score-display"><span data-i18n="scoreText">Score: </span><span id="score">0</span></div>
        <button id="pause-btn">⏸</button>
    </div>
    <div id="board-area">
        <div id="tetris-board"></div>
        <div id="zone-left"></div>
        <div id="zone-down"></div>
        <div id="zone-right"></div>
    </div>
    <div id="rotate-area">
        <button id="btn-rotate" data-i18n="ruleRotate">↻ &nbsp; ROTATE</button>
    </div>
</div>

<!-- PAUSE -->
<div class="overlay" id="pause-screen">
    <div class="game-over-box" style="text-align: left;">
        <h2 style="text-align: center; margin-top:0;" data-i18n="paused">PAUSED</h2>
        <div style="display: flex; gap: 10px; margin-bottom: 15px; justify-content: center;">
            <button id="lang-en-pause" class="btn outline-btn active" style="padding: 5px 10px; flex: 1; text-transform:none;">English</button>
            <button id="lang-ml-pause" class="btn outline-btn" style="padding: 5px 10px; flex: 1; text-transform:none;">മലയാളം</button>
        </div>
        <button class="btn btn-primary" style="margin-bottom:10px;" id="resume-btn" data-i18n="resume">Resume</button>
        <button class="btn btn-neutral" style="margin-bottom:10px;" id="pause-restart-btn" data-i18n="playAgain">Restart</button>
        <button class="btn btn-danger" id="quit-home-btn" data-i18n="quit">Quit Game</button>
    </div>
</div>

<!-- GAME OVER -->
<div class="overlay" id="gameover-screen">
    <div class="game-over-box">
        <h2 data-i18n="gameOverTitle">Game Over!</h2>
        <p class="ovr-score" style="margin: 15px 0;"><span data-i18n="scoreText">Score: </span><span id="final-score">0</span></p>
        <button class="btn btn-primary" id="restart-btn" data-i18n="playAgain" style="margin-bottom:10px;">Play Again</button>
        <button class="btn btn-neutral" id="go-home-btn" data-i18n="backHub">← Hub</button>
    </div>
</div>

<script src="js/sounds.js"></script>
<script src="js/tetris.js"></script>
</body>
</html>
