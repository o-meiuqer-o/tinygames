<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Block Drop | TinyGames</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 10px; margin-bottom: 10px;">
            <a href="index.html" class="back-btn" style="margin-bottom: 0;">&larr; Hub</a>
            <h1 style="font-size: 1.8rem;">Block Drop</h1>
            <div>
                <button id="install-pwa-btn" class="install-pwa-btn hidden" style="margin: 0; padding: 5px 10px;">Install</button>
                <button id="pause-btn" style="margin-left: 5px; padding: 5px 15px; font-size: 1.2rem; background: #333; border-radius: 8px;">⏸</button>
            </div>
        </header>

        <div id="setup-area" class="room-setup">
            <h3>Ready to drop some blocks?</h3>
            <button id="start-game-btn" style="width: 100%; padding: 15px; font-size: 1.2rem; margin-top: 20px;">Start Game</button>
        </div>

        <div class="tetris-wrapper hidden" id="game-area" style="display: flex; flex-direction: column; width: 100%; flex-grow: 1; align-items: center;">
            <div class="score-board" style="width: 100%; display: flex; justify-content: center; margin-bottom: 10px;">
                <div class="score-p1" style="font-size: 1.5rem;">Score: <span id="score">0</span></div>
            </div>
            
            <div style="flex-grow: 1; width: 100%; display: flex; justify-content: center; align-items: stretch; position: relative; min-height: 50vh; margin-bottom: 15px;">
                <!-- The Board -->
                <div class="tetris-board" id="tetris-board" style="height: auto; aspect-ratio: 1/2; background-color: #111; border: 2px solid #333; position: relative; max-width: 100%;">
                    <div id="pause-screen" class="hidden" style="position: absolute; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.85); z-index: 200; display: flex; flex-direction: column; align-items: center; justify-content: center; color: white;">
                        <h2 style="font-size: 2rem; margin-bottom: 20px;">PAUSED</h2>
                        <button id="resume-btn" style="margin-bottom: 15px; width: 80%; padding: 12px; font-size: 1rem;">Resume</button>
                        <button id="pause-restart-btn" style="margin-bottom: 15px; width: 80%; padding: 12px; font-size: 1rem; background: var(--card-bg);">Restart</button>
                        <button id="quit-home-btn" style="width: 80%; padding: 12px; font-size: 1rem; background: #ff007f;">Quit to Hub</button>
                    </div>
                </div>

                <!-- Touch Zones directly over the board container -->
                <div id="zone-left" style="position: absolute; left: 0; top: 0; bottom: 0; width: 25%; z-index: 100;"></div>
                <div id="zone-down" style="position: absolute; left: 25%; right: 25%; top: 0; bottom: 0; z-index: 100;"></div>
                <div id="zone-right" style="position: absolute; right: 0; top: 0; bottom: 0; width: 25%; z-index: 100;"></div>
            </div>

            <div style="width: 100%; display: flex; justify-content: center; padding-bottom: 20px;">
                <button id="btn-rotate" style="width: 80%; max-width: 300px; padding: 15px; font-size: 1.5rem; background: linear-gradient(45deg, var(--primary), var(--secondary)); border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);">↻ Rotate</button>
            </div>
        </div>

        <div id="game-over-screen" class="room-setup hidden" style="margin-top: 20px;">
            <h2 style="color: var(--secondary)">Game Over!</h2>
            <p style="margin: 10px 0;">Final Score: <span id="final-score"></span></p>
            <button id="restart-btn">Play Again</button>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/tetris.js"></script>
</body>
</html>
