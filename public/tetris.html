<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Block Drop | TinyGames</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00d2ff; --secondary: #ff007f; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        html, body { width: 100%; height: 100%; background: #0a0a0a; color: white; overflow: hidden; touch-action: none; }

        /* SETUP SCREEN */
        #setup-screen {
            position: fixed; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: #0a0a0a; z-index: 999; gap: 20px;
        }
        #setup-screen h1 {
            font-size: 3rem; font-weight: 800;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        #setup-screen p { color: #888; font-size: 0.95rem; text-align: center; padding: 0 30px; }
        #start-game-btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none; padding: 18px 50px; border-radius: 50px; color: white;
            font-size: 1.3rem; font-weight: 700; cursor: pointer; box-shadow: 0 5px 30px rgba(0,210,255,0.4);
        }
        #back-link { color: #555; text-decoration: none; font-size: 0.9rem; }

        /* GAME SCREEN */
        #game-screen { position: fixed; inset: 0; display: none; flex-direction: column; }

        #top-bar {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 14px; background: rgba(0,0,0,0.8); flex-shrink: 0; z-index: 50;
        }
        #top-bar a { color: #777; text-decoration: none; font-size: 0.85rem; }
        #score-display { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
        #pause-btn {
            background: #222; border: 1px solid #444; border-radius: 8px; color: white;
            font-size: 1.2rem; width: 42px; height: 42px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* Board fills all space between top bar and rotate button */
        #board-area {
            flex: 1; display: flex; align-items: stretch; justify-content: center;
            position: relative; overflow: hidden; background: #0a0a0a;
        }
        #tetris-board {
            /* 10 cols : 20 rows = 1:2 ratio, grows to fill height */
            height: 100%; aspect-ratio: 1 / 2; max-width: 100%;
            background: #111; border-left: 2px solid #2a2a2a; border-right: 2px solid #2a2a2a;
            position: relative; flex-shrink: 0;
        }
        .t-cell { position: absolute; width: 10%; height: 5%; box-sizing: border-box; }

        /* Touch zones sit on top of board-area */
        #zone-left, #zone-right, #zone-down {
            position: absolute; z-index: 10; top: 0; bottom: 0;
        }
        #zone-left  { left: 0;   width: 30%; }
        #zone-right { right: 0;  width: 30%; }
        #zone-down  { left: 30%; width: 40%; }

        /* Rotate bar at bottom */
        #rotate-area {
            flex-shrink: 0; padding: 10px 20px 22px; display: flex;
            justify-content: center; background: rgba(0,0,0,0.8);
        }
        #btn-rotate {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border: none; border-radius: 50px; color: white; font-size: 1.3rem;
            font-weight: 700; padding: 16px 0; width: 90%; max-width: 360px;
            cursor: pointer; box-shadow: 0 4px 20px rgba(0,210,255,0.3); letter-spacing: 1px;
        }

        /* PAUSE OVERLAY */
        #pause-screen {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 500;
            display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        }
        #pause-screen h2 { font-size: 2.5rem; letter-spacing: 4px; }

        /* GAME OVER OVERLAY */
        #gameover-screen {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 500;
            display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
        }
        #gameover-screen h2 { font-size: 2.5rem; color: var(--secondary); }
        #gameover-screen p  { color: #aaa; font-size: 1.2rem; }
        #gameover-screen span { color: var(--primary); font-weight: 800; }

        .overlay-btn {
            width: 75%; max-width: 280px; padding: 14px; border-radius: 12px; border: none;
            font-size: 1.1rem; font-weight: 600; cursor: pointer; color: white;
        }
        .btn-primary  { background: linear-gradient(45deg, var(--primary), var(--secondary)); }
        .btn-neutral  { background: #2a2a2a; }
        .btn-danger   { background: var(--secondary); }
    </style>
</head>
<body>

<div id="setup-screen">
    <h1>Block Drop</h1>
    <p>Tap left / right sides to move<br>Tap centre to soft drop</p>
    <button id="start-game-btn">▶ &nbsp;Start Game</button>
    <a href="index.html" id="back-link">← Back to Hub</a>
</div>

<div id="game-screen">
    <div id="top-bar">
        <a href="index.html">← Hub</a>
        <div id="score-display">Score: <span id="score">0</span></div>
        <button id="pause-btn">⏸</button>
    </div>
    <div id="board-area">
        <div id="tetris-board"></div>
        <div id="zone-left"></div>
        <div id="zone-down"></div>
        <div id="zone-right"></div>
    </div>
    <div id="rotate-area">
        <button id="btn-rotate">↻ &nbsp;ROTATE</button>
    </div>
</div>

<div id="pause-screen">
    <h2>PAUSED</h2>
    <button class="overlay-btn btn-primary"  id="resume-btn">Resume</button>
    <button class="overlay-btn btn-neutral"  id="pause-restart-btn">Restart</button>
    <button class="overlay-btn btn-danger"   id="quit-home-btn">Quit to Hub</button>
</div>

<div id="gameover-screen">
    <h2>Game Over!</h2>
    <p>Score: <span id="final-score">0</span></p>
    <button class="overlay-btn btn-primary" id="restart-btn">Play Again</button>
    <button class="overlay-btn btn-neutral" id="go-home-btn">← Hub</button>
</div>

<script src="js/tetris.js"></script>
</body>
</html>
